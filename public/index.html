<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI SDLC Copilot</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2300875a'/%3E%3Cpath d='M9 21l5-10 4 7 2-3 3 6' stroke='white' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar" id="topbar" hidden>
    <a class="brand" href="#/projects"><span class="logo" aria-hidden="true"></span>AI SDLC Copilot</a>
    <nav class="topnav" id="topnav"></nav>
    <div class="who" id="who"></div>
  </header>
  <main id="app" tabindex="-1"></main>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <div id="busy" class="busy" hidden>
    <div class="busy-card">
      <div class="spinner" aria-hidden="true"></div>
      <h3 id="busy-title">Working...</h3>
      <ol class="agent-steps" id="busy-steps"></ol>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
  <script src="app.js" type="module"></script>
</body>
</html>
